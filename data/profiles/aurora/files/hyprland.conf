# Aurora — atmospheric violet-night Hyprland configuration
# Managed by Faceless (profile: aurora).

monitor = ,preferred,auto,1

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 8
    gaps_out = 16
    border_size = 2
    col.active_border = rgba(80e5c8ee) rgba(805ef7ee)
    col.inactive_border = rgba(241a3caa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 9
        passes = 3
        vibrancy = 0.24
        brightness = 0.85
        noise = 0.03
    }
    drop_shadow = true
    shadow_range = 22
    shadow_render_power = 3
    col.shadow = rgba(0a0514aa)
}

animations {
    enabled = true
    bezier = drift, 0.16, 1, 0.3, 1
    animation = windows, 1, 6, drift, popin 88%
    animation = windowsOut, 1, 5, drift, popin 84%
    animation = fade, 1, 5, drift
    animation = workspaces, 1, 5, drift, slide
    animation = border, 1, 8, drift
}

dwindle {
    pseudotile = false
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
}

$terminal = kitty
$menu = wofi --show drun

bind = SUPER, Return, exec, $terminal
bind = SUPER, D, exec, $menu
bind = SUPER, Q, killactive
bind = SUPER SHIFT, E, exit
bind = SUPER, V, togglefloating
bind = SUPER, F, fullscreen
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

exec-once = waybar
exec-once = mako

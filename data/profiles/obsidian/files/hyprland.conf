# Obsidian — restrained dark Hyprland configuration
# Managed by Faceless (profile: obsidian). See the Faceless backups to restore.

monitor = ,preferred,auto,1

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(6eaccdaa) rgba(2a2d38aa)
    col.inactive_border = rgba(2a2d38aa)
    layout = dwindle
}

decoration {
    rounding = 6
    active_opacity = 1.0
    inactive_opacity = 0.96
    blur {
        enabled = true
        size = 5
        passes = 2
        noise = 0.017
        brightness = 0.92
    }
    drop_shadow = false
}

animations {
    enabled = true
    bezier = smooth, 0.22, 0.9, 0.24, 1
    animation = windows, 1, 5, smooth, popin 82%
    animation = windowsOut, 1, 5, smooth, popin 82%
    animation = fade, 1, 4, smooth
    animation = workspaces, 1, 4, smooth, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# obsidian palette: slate on ink, quiet blue accent
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

$terminal = kitty
$menu = wofi --show drun

bind = SUPER, Return, exec, $terminal
bind = SUPER, D, exec, $menu
bind = SUPER, Q, killactive
bind = SUPER, E, exec, $menu
bind = SUPER SHIFT, E, exit
bind = SUPER, V, togglefloating
bind = SUPER, P, pseudo
bind = SUPER, J, togglesplit
bind = SUPER, F, fullscreen
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

bindel = SUPER, left, movefocus, l
exec-once = waybar
exec-once = mako

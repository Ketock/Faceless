<?xml version="1.0" encoding="UTF-8"?>
<!-- Faceless: abstract jester mask logo (see notes below the root element). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Faceless — the jester's mask (application logo).
    Abstract, geometric mask: split halves (crimson left / violet right),
    sharp angular gold eyes, harlequin diamond accents on an ink plate.
    Deliberately not a face or a clown: a shield-like silhouette that
    stays legible down to 16 px.
  -->

  <title>Faceless — the jester's mask</title>

  <!-- ink plate -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0d0a0f"/>

  <!-- harlequin diamond accents (tiny, never dominant) -->
  <path d="M9 13 L11.6 15.6 L9 18.2 L6.4 15.6 Z" fill="#d9a441" opacity="0.6"/>
  <path d="M55 45.8 L57.6 48.4 L55 51 L52.4 48.4 Z" fill="#d9a441" opacity="0.6"/>

  <!-- jester hood points, shaded per half -->
  <path d="M15 24 L8 8 L27 17 Z" fill="#8c1f36"/>
  <path d="M49 24 L56 8 L37 17 Z" fill="#5b35a0"/>

  <!-- mask halves: angular shield silhouette, split at the seam -->
  <path d="M32 20 L15 24 L21 47 L32 56 Z" fill="#c22f4a"/>
  <path d="M32 20 L49 24 L43 47 L32 56 Z" fill="#7d4bd6"/>

  <!-- seam notch cut into the brow -->
  <path d="M32 20 L28.5 15.5 L35.5 15.5 Z" fill="#0d0a0f"/>

  <!-- sharp angular eyes in gold -->
  <path d="M19.5 31.5 L28 29 L26.6 35.2 L19.5 33 Z" fill="#d9a441"/>
  <path d="M44.5 31.5 L36 29 L37.4 35.2 L44.5 33 Z" fill="#d9a441"/>
</svg>
